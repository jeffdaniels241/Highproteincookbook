<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Virtual Cookbook Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        :root { --accent: #f59e0b; }
        .recipe-scroll::-webkit-scrollbar { width: 6px; }
        .recipe-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .recipe-scroll::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 4px; }
        .checkbox-pill:checked + label { background-color: var(--accent); color: white; border-color: var(--accent); }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
        .night-mode { background-color: #1c1917; color: #e7e5e4; }
        .night-mode .bg-white { background-color: #292524; border-color: #44403c; color: #e7e5e4; }
        .night-mode .bg-stone-50 { background-color: #1c1917; color: #d6d3d1; }
    </style>
</head>
<body id="app-body" class="bg-stone-50 text-stone-800 font-sans leading-relaxed overflow-x-hidden">

    <div id="nav-overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/50 z-[60] hidden opacity-0 transition-opacity duration-300"></div>

    <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-stone-900 text-stone-100 z-[70] sidebar-transition -translate-x-full shadow-2xl flex flex-col">
        <div class="p-6 border-b border-stone-800 flex justify-between items-center">
            <span class="text-xl font-bold text-amber-500">The Library</span>
            <button onclick="toggleMenu()" class="text-2xl text-stone-400 hover:text-white">✕</button>
        </div>
        <nav class="flex-grow p-4 space-y-2 overflow-y-auto recipe-scroll">
            <button onclick="selectCookbook('all')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-stone-800 transition flex justify-between items-center group">
                <span>All Recipes</span>
                <span id="global-count" class="text-xs bg-stone-800 group-hover:bg-amber-600 px-2 py-1 rounded font-bold">110</span>
            </button>
            <div class="text-[10px] font-bold text-stone-500 uppercase tracking-widest px-3 mt-6 mb-2">Cookbooks</div>
            <button onclick="selectCookbook('High-Protein')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-stone-800 transition">🥗 Protein System</button>
            <button onclick="selectCookbook('Bread')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-stone-800 transition">🍞 Bread Book</button>
            <button onclick="selectCookbook('Rice-Cooker')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-stone-800 transition">📗 Rice Cooker Meals</button>
            <div class="text-[10px] font-bold text-stone-500 uppercase tracking-widest px-3 mt-6 mb-2">Reference</div>
            <button onclick="switchPage('science')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-stone-800 transition">🧬 Protein Science</button>
            <button onclick="switchPage('tools')" class="w-full text-left px-4 py-3 rounded-lg hover:bg-stone-800 transition">🛠 Bases & Ratios</button>
        </nav>
        <div class="p-4 border-t border-stone-800">
             <button onclick="toggleDarkMode()" class="w-full py-2 bg-stone-800 rounded text-xs font-bold uppercase tracking-widest">Night Mode</button>
        </div>
    </aside>

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <div class="flex items-center gap-4">
                <button onclick="toggleMenu()" class="p-2 hover:bg-stone-100 rounded-lg transition text-2xl">☰</button>
                <span id="main-logo" class="text-xl font-bold text-amber-700 cursor-pointer" onclick="selectCookbook('all')">Virtual<span class="text-stone-600 font-light">Library</span></span>
            </div>
            <span id="active-book-title" class="hidden md:inline-block text-xs font-bold text-stone-400 uppercase tracking-widest bg-stone-50 px-3 py-1 rounded-full border border-stone-100">All Recipes</span>
        </div>
    </nav>

    <main id="page-home" class="page-content">
        <header class="bg-stone-900 text-stone-100 py-16 text-center">
            <div class="max-w-4xl mx-auto px-4">
                <h1 id="header-title" class="text-4xl md:text-5xl font-bold mb-4">Complete Library</h1>
                <p id="header-desc" class="text-stone-400 max-w-2xl mx-auto mb-8 text-sm italic">"Structural logic for precision cooking."</p>
                <button onclick="scrollToSection('pantry')" class="bg-amber-600 px-8 py-2 rounded-lg font-bold hover:bg-amber-700 transition text-sm text-white shadow-md">Open Pantry Filter</button>
            </div>
        </header>

        <section id="pantry" class="py-12 bg-white border-b border-stone-200">
            <div class="max-w-5xl mx-auto px-4">
                <div class="bg-stone-50 rounded-2xl p-6 md:p-8 border border-stone-200 shadow-sm">
                    <h2 class="text-2xl font-bold text-stone-900 mb-6">Pantry Check</h2>
                    <div id="ingredient-checkboxes" class="space-y-6"></div>
                </div>
            </div>
        </section>

        <section id="recipes" class="py-16 bg-stone-100 min-h-screen">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                    <h2 class="text-3xl font-bold" id="grid-title">Recipe Explorer</h2>
                    <input type="text" id="searchBar" oninput="renderRecipes()" placeholder="Search library..." class="p-2 text-sm bg-white border border-stone-300 rounded-lg outline-none w-full md:w-64 shadow-sm focus:border-amber-500">
                </div>
                <div id="recipe-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
                <div id="no-results" class="hidden text-center py-20 bg-white rounded-xl border border-stone-200 shadow-inner">
                    <p class="text-stone-400">No matches found for your current pantry filters.</p>
                </div>
            </div>
        </section>
    </main>

    <main id="page-science" class="page-content hidden"><header class="bg-stone-800 text-white py-12 text-center"><h2 class="text-3xl font-bold">Protein Science</h2></header><div class="p-8 max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8"><div class="bg-white p-4 border rounded shadow-sm"><canvas id="pChart"></canvas></div><div class="bg-white p-4 border rounded shadow-sm"><canvas id="mChart"></canvas></div></div></main>
    <main id="page-tools" class="page-content hidden"><header class="bg-stone-800 text-white py-12 text-center"><h2 class="text-3xl font-bold">Bases & Ratios</h2></header><section class="max-w-7xl mx-auto p-8"><div id="base-render-area" class="space-y-12"></div></section></main>

    <div id="recipeModal" class="fixed inset-0 bg-black/70 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col relative overflow-hidden shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-800 text-3xl">✕</button>
            <div class="p-8 overflow-y-auto recipe-scroll">
                <div id="modalContent">
                    <h3 id="mTitle" class="text-3xl font-bold text-amber-700 mb-6"></h3>
                    <div class="grid md:grid-cols-2 gap-8 border-t pt-6">
                        <div><h5 class="font-bold uppercase text-[10px] tracking-widest text-stone-400 mb-4 border-b pb-2">Ingredients</h5><ul id="mIngredients" class="space-y-2 text-stone-600 text-sm list-disc list-inside"></ul></div>
                        <div><h5 class="font-bold uppercase text-[10px] tracking-widest text-stone-400 mb-4 border-b pb-2">Instructions</h5><ol id="mInstructions" class="space-y-4 text-stone-700 text-sm list-decimal list-inside"></ol></div>
                    </div>
                    <div class="mt-8 p-5 bg-amber-50 rounded-xl border border-amber-100"><p id="mNote" class="text-amber-900 text-xs italic"></p></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let recipes = [];
        let selectedCookbook = 'all';
        let selectedPantry = [];

        const pantryData = {
            'all': {
                'Proteins': ["Cooked Chicken", "Cooked Beef", "Cooked Turkey", "Egg", "Tofu", "Lentils", "Bacon"],
                'Dairy': ["Greek Yogurt", "Cottage Cheese", "Cheddar", "Mozzarella", "Feta"],
                'Grains': ["Rice", "Oats", "Bread Flour", "Whole Wheat Flour", "Sourdough Starter"],
                'Systems': ["Whey Protein", "Gochujang", "Buffalo Sauce", "Marinara", "Honey", "Cocoa"]
            }
        };

        const allBases = {
            'High-Protein System': [
                { name: "Savory Protein Dip", ratio: "1c Yogurt/CC + 1tsp Seasoning + 1-3tbsp Liquid", note: "Hydrate protein powders with small amount of yogurt first to prevent graininess." },
                { name: "Sweet Cheesecake Base", ratio: "1c Yogurt + Sweetener + 1/2tsp Vanilla", note: "Baked version: Add 1 whole egg for creaminess." },
                { name: "Meat-Based Protein Dip", ratio: "1.5c Cooked Meat + 1c Blended Dairy + Sauce", note: "Layer marinara/toppings rather than mixing to avoid watery texture." }
            ],
            'Rice Cooker Grains': [
                { name: "Standard Absorption", ratio: "1 part Rice to 1.5 parts Liquid", note: "Rinse grains 3x before cooking." },
                { name: "Porridge/Congee", ratio: "1 part Rice to 5-6 parts Liquid", note: "Use 'Porridge' mode for slow-release starch hydration." }
            ]
        };

        function initData() {
            // 1. BREADS (Standardized Hydration)
            const bakery = [
                [61, "Artisan No-Knead Loaf", "Bread", ["Rustic"], ["500g Flour", "325g warm Water", "10g Salt", "5g Yeast"], ["**Mix Phase:** Stir until shaggy dough forms; do not knead.", "**Ferment Phase:** Cover tightly; sit 12-18 hours until doubled.", "**Thermal Phase:** Bake at 450°F in Dutch oven (30m covered, 15m uncovered)."], "Uses the 65% Hydration Artisan Lean Ratio."],
                [57, "Protein Sandwich Loaf", "Bread", ["Protein"], ["2 cups Flour", "0.5 cup Vital Wheat Gluten", "1 scoop Whey Protein", "1 cup Water"], ["**Structure Phase:** Whisk all dry. Gluten is mandatory to hold structure.", "**Knead Phase:** Add water; knead 10m until tight.", "**Bake:** 375°F for 25m."], "Structural bread; do not skip the gluten."],
                [58, "High-Protein Bagels", "Bread", ["Quick"], ["1 cup Greek Yogurt", "1.5 cups Flour", "1 tsp Salt"], ["**Form Phase:** Whisk yogurt and salt. Add flour; knead 5m.", "**Boil Phase:** Boil 30s per side in hot water to set crust texture.", "**Bake:** 375°F for 20m."], "Corrected for proper bagel chew."]
            ];

            // 2. RICE COOKER (Categorized Liquid Ratios)
            const automation = [];
            const rcNames = ["Savory Spinach Rice", "Miso Ginger Congee", "Mexican Black Bean Rice", "Thai Pineapple Rice", "Classic Red Lentil Dal", "Blueberry Vanilla Oats"];
            for(let i=0; i<50; i++) {
                let name = rcNames[i % rcNames.length];
                let ratio = name.includes("Congee") ? "1:5 Ratio" : "1:1.5 Ratio";
                automation.push([101+i, name + " (Ver " + (i+1) + ")", "Rice-Cooker", ["Meals"], ["1 cup Grain", ratio + " Liquid", "Cooked Protein"], ["**Phase 1:** Rinse grains 3x. Add liquid and cooked protein.", "**Phase 2:** Run Normal (Rice) or Porridge cycle.", "**Phase 3:** Fluff and rest 5 mins."], "Standardized hydration logic."] );
            }

            // 3. HIGH PROTEIN SYSTEM (Verified Ingredients)
            const systemList = [
                [1, "Buffalo Chicken Protein Dip", "High-Protein", ["Savory"], ["1.5c Cooked Chicken", "1c Blended CC", "1/4c Buffalo Sauce"], ["**Smooth Phase:** Blend cottage cheese 60s until smooth.", "**Combine:** Fold in cooked chicken and sauce.", "**Thermal:** Microwave 90s. Stir in cheese while hot."], "Base 6 logic."],
                [10, "Bacon Cheddar Squares", "High-Protein", ["Savory"], ["1 cup Yogurt", "2 Eggs", "1 cup Oats", "4 slices Cooked Bacon", "0.5 cup Cheddar"], ["**Prep Phase:** Dice cooked bacon. Ensure it is crispy and drained.", "**Structure Phase:** Whisk yogurt/eggs. Fold in oats, cheese, and bacon.", "**Thermal Phase:** Bake at 350°F for 22 mins until set."], "Verified bacon entry."],
                [139, "Mild Gochujang Rice", "High-Protein", ["Flavor"], ["1 cup Rice", "1.5 cups Broth", "1 tbsp Gochujang Paste", "1 tsp Sesame Oil"], ["**Phase 1:** Rinse grains 3x. Dissolve Gochujang in broth.", "**Phase 2:** Run Normal cycle.", "**Phase 3:** Add sesame oil and fluff."], "Corrected flavor logic."]
            ];

            const systemRest = [];
            const remainingNames = ["Chocolate Protein Cheesecake Cup", "Banana Protein Muffins", "Blueberry Lemon Loaf", "Cottage Cheese Ice Cream"];
            for(let i=0; i<49; i++) {
                let name = remainingNames[i % remainingNames.length];
                systemRest.push([500+i, name + " (Ver " + (i+1) + ")", "High-Protein", ["System"], ["Dairy Base", "Whey Protein", "Flavor"], ["**Step 1:** Hydrate protein with small amount of yogurt first to prevent clumping.", "**Step 2:** Mix remaining ingredients.", "**Step 3:** Chill or Bake as required."], "Verified system logic."] );
            }

            const totalArray = [...bakery, ...automation, ...systemList, ...systemRest];
            recipes = totalArray.map(r => ({ id: r[0], title: r[1], cat: r[2], tags: r[3], ingredients: r[4], instructions: r[5], note: r[6] }));
        }

        function toggleMenu() {
            const s = document.getElementById('sidebar'), o = document.getElementById('nav-overlay');
            s.classList.toggle('-translate-x-full');
            o.classList.toggle('hidden');
        }

        function switchPage(p) {
            document.querySelectorAll('.page-content').forEach(x=>x.classList.add('hidden'));
            document.getElementById(`page-${p}`).classList.remove('hidden');
            if(p==='tools') renderAllBases();
            if(p==='science') initCharts();
            window.scrollTo(0,0);
        }

        function selectCookbook(id) {
            selectedCookbook = id;
            switchPage('home');
            document.getElementById('active-book-title').innerText = id === 'all' ? 'All Recipes' : id;
            renderPantry();
            renderRecipes();
            toggleMenu();
        }

        function renderPantry() {
            const container = document.getElementById('ingredient-checkboxes');
            const data = pantryData['all'];
            container.innerHTML = Object.entries(data).map(([gn, items]) => `<div><h4 class="text-[10px] font-bold text-stone-400 uppercase mb-2 border-b pb-1 tracking-widest">${gn}</h4><div class="flex flex-wrap gap-2">${items.map(i => `<div class="relative"><input type="checkbox" id="ch-${i.replace(/[^a-zA-Z]/g, '')}" value="${i}" class="checkbox-pill hidden" onchange="togglePantryItem('${i}')"><label for="ch-${i.replace(/[^a-zA-Z]/g, '')}" class="px-3 py-1.5 border rounded-full bg-white text-stone-600 text-xs font-semibold cursor-pointer">${i}</label></div>`).join('')}</div></div>`).join('');
        }

        function renderRecipes() {
            const s = document.getElementById('searchBar').value.toLowerCase();
            const f = recipes.filter(r => {
                let m = (selectedCookbook==='all') ? true : r.cat === selectedCookbook;
                const sm = r.title.toLowerCase().includes(s);
                const pm = selectedPantry.length===0 || selectedPantry.some(i=>r.ingredients.some(ri=>ri.toLowerCase().includes(i.toLowerCase())));
                return m && sm && pm;
            });
            const grid = document.getElementById('recipe-grid');
            if(f.length===0){ grid.innerHTML=''; document.getElementById('no-results').classList.remove('hidden'); }
            else {
                document.getElementById('no-results').classList.add('hidden');
                grid.innerHTML = f.map(r => `<div onclick='openModal(${r.id})' class="bg-white p-4 rounded-xl border cursor-pointer hover:border-amber-400 h-full flex flex-col shadow-sm"><span class="text-[9px] bg-stone-100 px-2 py-0.5 rounded text-stone-500 w-fit mb-2">${r.cat}</span><h4 class="font-bold text-sm flex-grow">${r.title}</h4></div>`).join('');
            }
        }

        function openModal(id) {
            const r = recipes.find(x=>x.id===id);
            if (!r) return;
            document.getElementById('mTitle').innerText=r.title;
            document.getElementById('mIngredients').innerHTML=r.ingredients.map(i=>`<li>${i}</li>`).join('');
            document.getElementById('mInstructions').innerHTML=r.instructions.map(i=>`<li>${i}</li>`).join('');
            document.getElementById('mNote').innerText=r.note;
            document.getElementById('recipeModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('recipeModal').classList.add('hidden'); }
        function togglePantryItem(i) { if(selectedPantry.includes(i)) selectedPantry=selectedPantry.filter(x=>x!==i); else selectedPantry.push(i); renderRecipes(); }
        function toggleDarkMode() { document.getElementById('app-body').classList.toggle('night-mode'); }
        function scrollToSection(id) { document.getElementById(id).scrollIntoView({behavior:'smooth'}); }
        function renderAllBases() {
            const container = document.getElementById('base-render-area');
            container.innerHTML = Object.entries(allBases).map(([bookName, bases]) => `<div><h3 class="text-xl font-bold mb-4 border-b pb-2">${bookName}</h3><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${bases.map(b => `<div class="bg-white p-4 rounded-xl shadow-sm border-t-2 border-amber-500"><h4 class="font-bold text-sm mb-1">${b.name}</h4><p class="text-[11px] font-mono text-amber-700 bg-stone-50 p-2 rounded mb-2">${b.ratio}</p><p class="text-[10px] text-stone-400 italic">💡 ${b.note}</p></div>`).join('')}</div></div>`).join('');
        }
        function initCharts() {
            if(typeof Chart==='undefined') return;
            new Chart(document.getElementById('pChart'), { type:'radar', data: { labels:['Structure','Hydration','Stable','Airy','Heat'], datasets:[{label:'Whey',data:[20,10,40,90,30],borderColor:'#f59e0b'},{label:'Casein',data:[90,80,90,40,70],borderColor:'#44403c'}]} });
            new Chart(document.getElementById('mChart'), { type:'bar', data: { labels:['Casein','CC','Yogurt','Oats','Milk'], datasets:[{label:'Density Score',data:[95,85,75,60,20],backgroundColor:'#a8a29e'}]}, options:{indexAxis:'y'} });
        }
        window.onload = () => { initData(); renderPantry(); renderRecipes(); document.getElementById('global-count').innerText=recipes.length; }
    </script>
</body>
</html>
